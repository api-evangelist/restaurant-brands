openapi: 3.2.0
info:
  version: 1.0.0
  title: Burger King's Partners Stores API
  description: '## Overview


    The Channel Partners API are provided for third party food ordering marketplaces

    integrating into the Restaurant Brand International (RBI) fulfillment platform.


    ## Authentication

    ### Webhooks


    Webhook requests are signed using `hex` encoded HMAC signatures.


    An HMAC signature is derived for validation using three components:


    - the secret shared between the service and the consumer

    - the body of the request

    - the hash function or algorithm (SHA-256)


    Using these three pieces of information, compute an HMAC signature using the secret as the key and

    the body of the request as the message and encode the signature to a hexadecimal string for comparison.


    Compare the signature generated using the above information to the signature received in the `x-signature` header,

    if the two signatures match, the request is valid.

    '
  x-logo:
    altText: RBI logo
    url: data:image/svg+xml;base64,
servers:
- url: https://sandbox-bk-partners.rbictg.com/api/v1
  description: Sandbox server (uses test data)
- url: https://bk-partners.rbictg.com/api/v1
  description: Production server
tags:
- name: Stores
paths:
  /stores/{storeId}:
    get:
      tags:
      - Stores
      summary: Store
      description: 'Store (restaurant) details.


        Use this endpoint get the full details of a specific store, including the Detailed Availability by service mode

        '
      operationId: getStore
      parameters:
      - $ref: '#/components/parameters/region'
      - name: storeId
        in: path
        description: Unique ID representing a store
        required: true
        schema:
          type: string
        example: '500123'
      security:
      - bearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Store'
              examples:
                GetStore200Example:
                  summary: Default getStore 200 response
                  x-microcks-default: true
                  value:
                    data:
                      availability:
                        isEnabled: {}
                        isOpen: {}
                      franchiseGroupName: Acme Group
                      location:
                        administrativeArea: {}
                        coordinates: {}
                        formattedAddress: {}
                        locality: {}
                        phoneNumber: {}
                        postalCode: {}
                        regionCode: {}
                        route: {}
                      name: Example test lab
                      posVendor: BRINK
                      serviceHour:
                      - {}
                      storeId: '42'
                      timezone: America/New_York
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                GetStore403Example:
                  summary: Default getStore 403 response
                  x-microcks-default: false
                  value:
                    status: 400
                    code: ValidationError
                    message: isAvailable must be a boolean value
                    errors:
                    - code: ValidationError
                      details: example
                      message: example
                      domain: example
                      location: isAvailable
                      locationType: requestBody
                      sendReport: example
                      extendedHelp: example
        '404':
          description: Store not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                GetStore404Example:
                  summary: Default getStore 404 response
                  x-microcks-default: false
                  value:
                    status: 400
                    code: ValidationError
                    message: isAvailable must be a boolean value
                    errors:
                    - code: ValidationError
                      details: example
                      message: example
                      domain: example
                      location: isAvailable
                      locationType: requestBody
                      sendReport: example
                      extendedHelp: example
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /stores/{storeId}/store-status-changed:
    post:
      tags:
      - Stores
      summary: Store Status Changed
      description: 'This endpoint is used to update the status of a store.

        '
      operationId: storeStatusChanged
      parameters:
      - name: storeId
        in: path
        description: Unique ID representing a store
        required: true
        schema:
          type: string
        example: '500123'
      security:
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreStatusChanged'
            examples:
              StoreStatusChangedRequestExample:
                summary: Default storeStatusChanged request
                x-microcks-default: true
                value:
                  reason: store was deactivated due to high error rate
                  region: US
                  storeStatus: ACTIVE
                  updatedAt: '1991-02-11T20:30:19Z'
      responses:
        '200':
          description: Successfully updated the store status.
        '400':
          description: Bad request due to missing field or content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                StoreStatusChanged400Example:
                  summary: Default storeStatusChanged 400 response
                  x-microcks-default: false
                  value:
                    status: 400
                    code: ValidationError
                    message: isAvailable must be a boolean value
                    errors:
                    - code: ValidationError
                      details: example
                      message: example
                      domain: example
                      location: isAvailable
                      locationType: requestBody
                      sendReport: example
                      extendedHelp: example
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                StoreStatusChanged403Example:
                  summary: Default storeStatusChanged 403 response
                  x-microcks-default: false
                  value:
                    status: 400
                    code: ValidationError
                    message: isAvailable must be a boolean value
                    errors:
                    - code: ValidationError
                      details: example
                      message: example
                      domain: example
                      location: isAvailable
                      locationType: requestBody
                      sendReport: example
                      extendedHelp: example
        '404':
          description: Store not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                StoreStatusChanged404Example:
                  summary: Default storeStatusChanged 404 response
                  x-microcks-default: false
                  value:
                    status: 400
                    code: ValidationError
                    message: isAvailable must be a boolean value
                    errors:
                    - code: ValidationError
                      details: example
                      message: example
                      domain: example
                      location: isAvailable
                      locationType: requestBody
                      sendReport: example
                      extendedHelp: example
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /stores:
    get:
      tags:
      - Stores
      summary: List Stores
      description: 'Store List.


        Use this endpoint get a list of stores and their info.


        **Pagination**


        Pagination is provided in a cursor-basis. For each set of results, a `cursor` will be returned as part of the

        response''s `meta`. Providing this `cursor` to the next call will fetch the next page of the result set.


        The max amount of restaurants to be returned is controlled by `limit`

        '
      operationId: getStores
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/region'
      security:
      - bearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  meta:
                    type: object
                    properties:
                      cursor:
                        description: Cursor to fetch the next set of results
                        $ref: '#/components/schemas/cursor'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Store'
              examples:
                GetStores200Example:
                  summary: Default getStores 200 response
                  x-microcks-default: true
                  value:
                    meta:
                      cursor: cursor-id
                    data:
                    - availability: {}
                      franchiseGroupName: Acme Group
                      location: {}
                      name: Example test lab
                      posVendor: {}
                      serviceHour:
                      - {}
                      storeId: {}
                      timezone: {}
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                GetStores403Example:
                  summary: Default getStores 403 response
                  x-microcks-default: false
                  value:
                    status: 400
                    code: ValidationError
                    message: isAvailable must be a boolean value
                    errors:
                    - code: ValidationError
                      details: example
                      message: example
                      domain: example
                      location: isAvailable
                      locationType: requestBody
                      sendReport: example
                      extendedHelp: example
        '404':
          description: Store not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                GetStores404Example:
                  summary: Default getStores 404 response
                  x-microcks-default: false
                  value:
                    status: 400
                    code: ValidationError
                    message: isAvailable must be a boolean value
                    errors:
                    - code: ValidationError
                      details: example
                      message: example
                      domain: example
                      location: isAvailable
                      locationType: requestBody
                      sendReport: example
                      extendedHelp: example
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
webhooks:
  storeUpdate:
    post:
      summary: Store Updated Event
      description: 'Store updated events are dispatched when a store''s availability or metadata

        has changed.


        The availability of individual stores can change regularly for a variety of

        reasons. In some cases a store may be experiencing a temporary outage, or a

        more widespread outage may be affecting the Point of Sale (POS) vendor. In

        addition, store operators can update operating hours and service modes, and

        expect these changes to be reflected across all supported platforms.


        When these `"STORE_UPDATED"` events are delivered, a request *must* be

        made to the provided `callbackUrl` to fetch the latest store details.

        '
      tags:
      - Stores
      parameters:
      - in: header
        name: x-signature
        description: A hex encoded HMAC signature
        schema:
          type: string
      operationId: storeUpdateEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand:
                  $ref: '#/components/schemas/Brand'
                callbackUrl:
                  description: 'URL from which the updated store details may be retrieved.

                    '
                  type: string
                  format: url
                  example: https://partners-bk.rbictg.com/api/v1/stores/42
                eventTime:
                  description: Store update event time.
                  $ref: '#/components/schemas/DateTime'
                eventType:
                  description: Webhook event type.
                  type: string
                  enum:
                  - STORE_UPDATED
                region:
                  $ref: '#/components/schemas/Region'
                storeId:
                  $ref: '#/components/schemas/StoreId'
              required:
              - brand
              - callbackUrl
              - eventTime
              - eventType
              - region
              - storeId
      responses:
        2XX:
          description: Event acknowledged
        4XX:
          description: Failed to acknowledge
        5XX:
          description: Failed to acknowledge
components:
  schemas:
    StoreStatus:
      title: storeStatus
      description: The current marketplace status of the store
      type: string
      enum:
      - ACTIVE
      - INACTIVE
    Region:
      title: Region
      description: 'Region

        The Unicode [Common Locale Data Repository (CLDR)](http://cldr.unicode.org/)

        region code of the country or region of the address.

        For example, the code for the United States is `US`.


        For the full list of codes, refer to the [CLDR Chart](http://www.unicode.org/cldr/charts/30/supplemental/territory_information.html).

        '
      example: US
      type: string
    TimeSlot:
      title: TimeSlot
      description: 'Contains information about the store service hours for a range of 15 consecutive days,

        starting from the day before the request is made.

        '
      type: object
      properties:
        closes:
          description: Store close time.
          example: '1991-02-11 23:59:00'
          format: ISO 8601 Date Time (YYYY-MM-DD hh:mm:ss)
          type: string
        date:
          description: Calendar day that this time slot reflects
          example: '1991-02-11'
          format: ISO 8601 Date (YYYY-MM-DD)
          type: string
        isClosed:
          description: 'Flag that determines if the store is closed.


            If the store is open, this property won''t be returned.

            '
          type: boolean
          example: true
        opens:
          description: Store open time.
          example: '1991-02-11 00:00:00'
          format: ISO 8601 Date Time (YYYY-MM-DD hh:mm:ss)
          type: string
      required:
      - opens
      - date
      - closes
    WeekdayHours:
      title: WeekDayHours
      description: 'Human-readable view of a store''s weekly operating hours.


        **Note**: This information is intended for display purposes only.

        If you need to perform calculations based on the service hours, use the `timeSlots` property instead.

        '
      type: object
      properties:
        text:
          description: "Human-readable days of operation.\n\nThe \"Time range\" looks like:\n- For days that the store is open:  \n  `Weekday: hh:mm A - hh:mm A` (`Sunday: 12:00 AM - 11:59 PM`)\n- For days that the store is closed:  \n  `Weekday: closed` (`Sunday: closed`)\n"
          type: string
          format: 'Weekday: Time range'
          example: 'Sunday: 12:00 AM - 11:59 PM'
    Brand:
      type: string
      enum:
      - BK
      example: BK
    Available:
      title: Available
      description: Information about store availability
      type: object
      properties:
        isEnabled:
          description: Detailed availability per service mode.
          type: array
          items:
            type: object
            properties:
              id:
                $ref: '#/components/schemas/ServiceMode'
              value:
                type: boolean
                description: "Returns true if the store is Operating Available.\n\n\"Operating Available\" considers the current date and time to calculate the current availability for the \nservice mode.\n"
        isOpen:
          description: True if the store is available for ordering.
          type: boolean
          example: true
      required:
      - isOpen
    PosVendor:
      title: posVendor
      description: The posVendor that is processing the order
      type: string
      enum:
      - BRINK
      - CARROLS
      - NCR
      - QDI
      - SICOM
    ServiceHour:
      title: ServiceHour
      description: Store operating hours by serviceMode
      type: object
      properties:
        serviceMode:
          $ref: '#/components/schemas/ServiceMode'
        timeSlots:
          description: 'Contains information about the store service hours for a range of 15 consecutive days,

            starting from the day before the request is made.

            '
          type: array
          items:
            $ref: '#/components/schemas/TimeSlot'
        weekdayHours:
          description: 'Human-readable view of a store''s weekly operating hours.


            **Note**: This information is intended for display purposes only.

            If you need to perform calculations based on the service hours, use the `timeSlots` property instead.

            '
          type: array
          items:
            $ref: '#/components/schemas/WeekdayHours'
      required:
      - serviceMode
      - timeSlots
    Store:
      title: Store
      description: Information about a store
      type: object
      properties:
        availability:
          $ref: '#/components/schemas/Available'
          description: True if the store is available for ordering.
        franchiseGroupName:
          description: Store franchise group name.
          type: string
          example: Acme Group
        location:
          $ref: '#/components/schemas/Location'
        name:
          description: Store name
          type: string
          example: Example test lab
        posVendor:
          $ref: '#/components/schemas/PosVendor'
        serviceHour:
          description: Store operating hours by serviceMode
          type: array
          items:
            $ref: '#/components/schemas/ServiceHour'
        storeId:
          $ref: '#/components/schemas/StoreId'
        timezone:
          $ref: '#/components/schemas/Timezone'
      required:
      - availability
      - name
      - storeId
      - timezone
      - posVendor
      - location
      - serviceHour
    Reason:
      title: reason
      description: Reason for the change in store status
      example: store was deactivated due to high error rate
      type: string
    Error:
      title: Error
      type: object
      description: Standard error format for all errors returned by the API
      properties:
        status:
          description: HTTP status code
          type: number
          example: 400
        code:
          description: Unique error code. Same as errors[0].code
          type: string
          example: ValidationError
        message:
          description: Human readable error mesage. Same as errors[0].message
          type: string
          example: isAvailable must be a boolean value
        errors:
          description: All errors
          type: array
          items:
            type: object
            properties:
              code:
                description: Unique error code
                type: string
                example: ValidationError
              details:
                description: Detailed error information
                type: string
              message:
                description: Human readable error mesage
                type: string
              domain:
                type: string
              location:
                type: string
                description: Location the error occurred. Interpreation depends on `locationType`
                example: isAvailable
              locationType:
                type: string
                description: How to interpret the location property
                example: requestBody
              sendReport:
                description: URL to report this error
                type: string
              extendedHelp:
                description: URL with additional information about the error type
                type: string
            required:
            - code
            - message
      required:
      - code
      - message
      - errors
    cursor:
      title: Cursor
      description: Pagination cursor
      example: cursor-id
      type: string
    ServiceMode:
      title: Service Mode
      description: 'How a customer would like their order served.


        Note that not all service modes will be available at all restaurants.

        '
      type: string
      example: TAKEOUT
      enum:
      - CURBSIDE
      - DELIVERY
      - DRIVE_THRU
      - EAT_IN
      - TABLE_SERVICE
      - TAKEOUT
    Location:
      title: Location
      description: Information about a store location.
      type: object
      properties:
        administrativeArea:
          description: Location administrative area.
          type: string
          example: FL
        coordinates:
          $ref: '#/components/schemas/GeoPoint'
        formattedAddress:
          description: Store address.
          type: string
          example: 5701 BLUE LAGOON DR, MIAMI, FL 33126
        locality:
          description: Store locality.
          type: string
          example: MIAMI
        phoneNumber:
          description: Store phone number.
          type: string
          example: 555-555-5555
        postalCode:
          description: Store postalCode.
          type: string
          example: '33126'
        regionCode:
          description: 'The Unicode [Common Locale Data Repository (CLDR)](http://cldr.unicode.org/)

            region code of the country or region of the address.

            For example, the code for the United States is `US`.


            For the full list of codes, refer to the [CLDR Chart](http://www.unicode.org/cldr/charts/30/supplemental/territory_information.html).

            '
          type: string
          example: US
        route:
          description: Store route.
          type: string
          example: 5701 BLUE LAGOON DR
    DateTime:
      type: string
      format: ISO 8601 Date Time
      example: '1991-02-11T20:30:19Z'
    StoreId:
      title: StoreId
      description: Unique Store ID
      example: '42'
      pattern: ^\d+$
      type: string
    StoreStatusChanged:
      title: StoreStatusChanged
      type: object
      properties:
        reason:
          $ref: '#/components/schemas/Reason'
        region:
          $ref: '#/components/schemas/Region'
        storeStatus:
          $ref: '#/components/schemas/StoreStatus'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
      required:
      - storeStatus
      - region
      - updatedAt
    limit:
      title: Limit
      description: Amount of results to fetch
      example: 10
      type: integer
      minimum: 1
      default: 20
      maximum: 100
    Timezone:
      title: Timezone
      description: 'Timezone from the IANA

        [tz database](https://en.wikipedia.org/wiki/Tz_database)

        '
      example: America/New_York
      type: string
    GeoPoint:
      title: GeoPoint
      description: The coordinates (latitude and longitude) for a given address.
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          description: Latitude
          type: number
          example: 25.782379
        longitude:
          description: Latitude
          type: number
          example: -80.289207
  parameters:
    cursor:
      description: Pagination cursor
      name: cursor
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/cursor'
      example: example
    region:
      description: 'The Unicode [Common Locale Data Repository (CLDR)](http://cldr.unicode.org/)

        region code of the country or region of the address.


        For the full list of country codes, refer to the [CLDR Chart](http://www.unicode.org/cldr/charts/30/supplemental/territory_information.html).

        '
      name: x-ui-region
      in: header
      example: US
      schema:
        type: string
    limit:
      description: Number of results to fetch
      name: limit
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/limit'
      example: example
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
x-tagGroups:
- name: API
  tags:
  - Loyalty
  - Orders
  - Menus
  - Stores
- name: Models
  tags:
  - OrderModel
  - MenuModel
  - StoreModel
  - ErrorModel

openapi: 3.2.0
info:
  version: 1.0.0
  title: Burger King's Partners Loyalty API
  description: '## Overview


    The Channel Partners API are provided for third party food ordering marketplaces

    integrating into the Restaurant Brand International (RBI) fulfillment platform.


    ## Authentication

    ### Webhooks


    Webhook requests are signed using `hex` encoded HMAC signatures.


    An HMAC signature is derived for validation using three components:


    - the secret shared between the service and the consumer

    - the body of the request

    - the hash function or algorithm (SHA-256)


    Using these three pieces of information, compute an HMAC signature using the secret as the key and

    the body of the request as the message and encode the signature to a hexadecimal string for comparison.


    Compare the signature generated using the above information to the signature received in the `x-signature` header,

    if the two signatures match, the request is valid.

    '
  x-logo:
    altText: RBI logo
    url: data:image/svg+xml;base64,
servers:
- url: https://sandbox-bk-partners.rbictg.com/api/v1
  description: Sandbox server (uses test data)
- url: https://bk-partners.rbictg.com/api/v1
  description: Production server
tags:
- name: Loyalty
paths:
  /loyalty/identify:
    post:
      summary: Identify
      tags:
      - Loyalty
      operationId: identify
      parameters: []
      security:
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifyRequest'
            examples:
              IdentifyRequestExample:
                summary: Default identify request
                x-microcks-default: true
                value:
                  identifier: '1234'
                  identifierType: OTP
                  storeId: '42'
                  serviceMode: TAKEOUT
                  details:
                    operator: {}
                    terminal: {}
                    transactionId: {}
      responses:
        '200':
          description: Loyalty identified
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IdentifyResponse'
                required:
                - data
              examples:
                Identify200Example:
                  summary: Default identify 200 response
                  x-microcks-default: true
                  value:
                    data:
                      cart:
                        menuSelections: {}
                      customer:
                        id: {}
                        externalReferenceId: {}
                        name: {}
                        username: {}
                        phone: {}
                        email: {}
                      loyalty:
                        balances: {}
                        loyaltyId: {}
                        transactionId: {}
                      storeId: '42'
                      serviceMode: TAKEOUT
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Identify400Example:
                  summary: Default identify 400 response
                  x-microcks-default: false
                  value:
                    status: 400
                    code: ValidationError
                    message: isAvailable must be a boolean value
                    errors:
                    - code: ValidationError
                      details: example
                      message: example
                      domain: example
                      location: isAvailable
                      locationType: requestBody
                      sendReport: example
                      extendedHelp: example
        '403':
          description: Authentication failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Identify403Example:
                  summary: Default identify 403 response
                  x-microcks-default: false
                  value:
                    status: 400
                    code: ValidationError
                    message: isAvailable must be a boolean value
                    errors:
                    - code: ValidationError
                      details: example
                      message: example
                      domain: example
                      location: isAvailable
                      locationType: requestBody
                      sendReport: example
                      extendedHelp: example
        '404':
          description: Identifier Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Identify404Example:
                  summary: Default identify 404 response
                  x-microcks-default: false
                  value:
                    status: 400
                    code: ValidationError
                    message: isAvailable must be a boolean value
                    errors:
                    - code: ValidationError
                      details: example
                      message: example
                      domain: example
                      location: isAvailable
                      locationType: requestBody
                      sendReport: example
                      extendedHelp: example
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Identify500Example:
                  summary: Default identify 500 response
                  x-microcks-default: false
                  value:
                    status: 400
                    code: ValidationError
                    message: isAvailable must be a boolean value
                    errors:
                    - code: ValidationError
                      details: example
                      message: example
                      domain: example
                      location: isAvailable
                      locationType: requestBody
                      sendReport: example
                      extendedHelp: example
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    Phone:
      title: Phone
      description: 'Phone number. Should always begin with the international country code (e.g., "+1")

        '
      type: string
      example: '+12223334444'
    MenuSelection:
      title: Menu Selection
      description: Menu selection in the cart
      type: object
      properties:
        id:
          type: string
          description: Menu item identifier
          example: item_42
        referenceId:
          type: string
          description: 'Secondary menu item identifier.


            ⚠️ This `referenceId` must be included along with the `id` when the value is present in the menu

            '
          example: item_603
        externalReferenceId:
          $ref: '#/components/schemas/ExternalReferenceId'
        quantity:
          type: number
          format: integer
          minimum: 0
          example: 1
        price:
          $ref: '#/components/schemas/Money'
        menuSelections:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MenuSelection'
      required:
      - id
      - quantity
    IdentifyRequestDetails:
      title: Identify Request Details
      type: object
      properties:
        operator:
          $ref: '#/components/schemas/Operator'
        terminal:
          $ref: '#/components/schemas/Terminal'
        transactionId:
          $ref: '#/components/schemas/TransactionId'
    Identifier:
      title: Identifier
      description: An OTP code (6 digit code) or a static Offer code (4 digit code)
      example: '1234'
      pattern: ^(\d{6}|\d{4})$
      type: string
    Balance:
      title: Balance
      description: The amount of a given currency the user has
      type: object
      properties:
        amount:
          type: number
          example: 599
        currency:
          type: string
          example: USD
    Cart:
      title: Cart
      description: Cart representing a customer's selections from the menu
      type: object
      properties:
        menuSelections:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MenuSelection'
      required:
      - menuSelections
    IdentifierType:
      title: Identifier Type
      description: Determines the type of identifier being sent
      type: string
      example: OTP
      enum:
      - OTP
      - OFFER_CODE
    TransactionId:
      title: Transaction Id
      description: The Partner specific order lookup id.
      example: ORD-000002
      type: string
    IdentifyResponse:
      title: Identify Response
      type: object
      properties:
        cart:
          $ref: '#/components/schemas/Cart'
        customer:
          $ref: '#/components/schemas/Customer'
        loyalty:
          $ref: '#/components/schemas/IdentifyLoyalty'
        storeId:
          $ref: '#/components/schemas/StoreId'
        serviceMode:
          $ref: '#/components/schemas/ServiceMode'
      required:
      - cart
      - storeId
      - serviceMode
    Error:
      title: Error
      type: object
      description: Standard error format for all errors returned by the API
      properties:
        status:
          description: HTTP status code
          type: number
          example: 400
        code:
          description: Unique error code. Same as errors[0].code
          type: string
          example: ValidationError
        message:
          description: Human readable error mesage. Same as errors[0].message
          type: string
          example: isAvailable must be a boolean value
        errors:
          description: All errors
          type: array
          items:
            type: object
            properties:
              code:
                description: Unique error code
                type: string
                example: ValidationError
              details:
                description: Detailed error information
                type: string
              message:
                description: Human readable error mesage
                type: string
              domain:
                type: string
              location:
                type: string
                description: Location the error occurred. Interpreation depends on `locationType`
                example: isAvailable
              locationType:
                type: string
                description: How to interpret the location property
                example: requestBody
              sendReport:
                description: URL to report this error
                type: string
              extendedHelp:
                description: URL with additional information about the error type
                type: string
            required:
            - code
            - message
      required:
      - code
      - message
      - errors
    ServiceMode:
      title: Service Mode
      description: 'How a customer would like their order served.


        Note that not all service modes will be available at all restaurants.

        '
      type: string
      example: TAKEOUT
      enum:
      - CURBSIDE
      - DELIVERY
      - DRIVE_THRU
      - EAT_IN
      - TABLE_SERVICE
      - TAKEOUT
    StoreId:
      title: StoreId
      description: Unique Store ID
      example: '42'
      pattern: ^\d+$
      type: string
    Terminal:
      title: Terminal
      description: The terminal name.
      example: window-2
      type: string
    IdentifyRequest:
      title: Identify Request
      type: object
      properties:
        identifier:
          $ref: '#/components/schemas/Identifier'
        identifierType:
          $ref: '#/components/schemas/IdentifierType'
        storeId:
          $ref: '#/components/schemas/StoreId'
        serviceMode:
          $ref: '#/components/schemas/ServiceMode'
        details:
          $ref: '#/components/schemas/IdentifyRequestDetails'
      required:
      - identifier
      - identifierType
      - storeId
      - serviceMode
    Customer:
      title: Customer
      description: Customer personal details
      type: object
      properties:
        id:
          type: string
          description: Internal user ID
          example: '500123'
        externalReferenceId:
          $ref: '#/components/schemas/ExternalReferenceId'
        name:
          type: string
          description: 'Customers''s name. Format will depend on the context (full name, first name and initials, etc)

            '
          example: Whopper
        username:
          type: string
          description: Customer's username in the given context
          example: example
        phone:
          $ref: '#/components/schemas/Phone'
        email:
          type: string
          description: Customer's email
          format: email
          example: guest@example.com
      required:
      - name
      - email
    Operator:
      title: Operator
      description: The cashier id submitting the transaction.
      example: ninja123
      type: string
    Currency:
      title: Currency Code
      description: Currency code in [ISO-4217 alpha](https://en.wikipedia.org/wiki/ISO_4217) format
      format: ISO-4217 alpha
      type: string
      example: USD
    LoyaltyTransactionId:
      title: Loyalty Transaction Id
      description: The loyalty transaction id created for the identify request
      example: a73ea594-202c-52b4-80af-1f6b518ef54d
      type: string
    IdentifyLoyalty:
      title: Loyalty Information
      description: User information on the Loyalty user identified
      type: object
      properties:
        balances:
          description: 'The loyalty user''s balances

            '
          type: array
          items:
            $ref: '#/components/schemas/Balance'
        loyaltyId:
          $ref: '#/components/schemas/LoyaltyId'
        transactionId:
          $ref: '#/components/schemas/LoyaltyTransactionId'
      required:
      - balances
      - loyaltyId
      - transactionId
    Money:
      title: Money
      description: 'Representation of money. Money amounts are always provided in the smallest currency unit (e.g,. 100 where `currency=USD` represents 100 "cents" or 1 USD).

        '
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        amount:
          title: Amount
          description: Amount in the specified currency
          type: number
          example: 100
          format: integer
      required:
      - currency
      - amount
    ExternalReferenceId:
      title: External Reference Id
      description: External reference ID. An example might be the external menu selection ID, customer ID or order ID.
      type: string
    LoyaltyId:
      title: Loyalty Id
      description: The loyalty user id
      example: a73ea594-202c-52b4-00a0-1f6b518ef54d
      type: string
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
x-tagGroups:
- name: API
  tags:
  - Loyalty
  - Orders
  - Menus
  - Stores
- name: Models
  tags:
  - OrderModel
  - MenuModel
  - StoreModel
  - ErrorModel
